name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server:
    name: Server — typecheck, unit + integration tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      NODE_ENV: test
      JWT_ACCESS_SECRET: ci-test-access-secret-not-for-production
      JWT_REFRESH_SECRET: ci-test-refresh-secret-not-for-production
      DATABASE_URL: "file:./dev.db"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npx tsc -p tsconfig.json --noEmit

      - name: Unit + integration tests
        run: npm test
        # The integration suite provisions its own isolated SQLite file (src/test/setup.ts) —
        # no external database service needed in this job, unlike a Postgres-backed setup would.

      - name: Migrate + seed (smoke test that the demo data path still works)
        run: |
          npm run db:push
          npm run seed

      - name: Build
        run: npm run build

  client:
    name: Client — typecheck, unit tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck + build
        run: npm run build
        # `build` already runs `tsc -b` before `vite build` — a type error fails this step.

      - name: Unit tests (offline sync engine)
        run: npm test

      - name: Check bundle size stays code-split
        run: |
          MAIN_CHUNK_KB=$(du -k dist/assets/index-*.js | cut -f1 | head -1)
          echo "Main chunk: ${MAIN_CHUNK_KB}KB"
          if [ "$MAIN_CHUNK_KB" -gt 500 ]; then
            echo "::error::Main chunk grew past 500KB (${MAIN_CHUNK_KB}KB) — code-splitting regression, see 04-frontend-architecture.md"
            exit 1
          fi
