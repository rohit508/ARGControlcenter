# better-sqlite3 has no postinstall download step in this version — a plain `npm install`
# compiles it from source via node-gyp, which needs Python + a C++ toolchain. Nixpacks' default
# Node image doesn't include Python, so without this, node-gyp fails outright (the earlier
# --ignore-scripts workaround avoided that failure but skipped the compile entirely, leaving a
# missing/mismatched binary that segfaults at runtime instead).
[phases.setup]
nixPkgs = ["...", "python3", "gcc", "gnumake"]
